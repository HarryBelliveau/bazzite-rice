# ---- Monitors (use `hyprctl monitors` to find names) ----
# Dell U2414H on the left, rotated 90° CW (portrait → 1080×1920 logical)
monitor = DP-2, 1920x1080@60, 0x-310, 1, transform, 1
# AOC Q32G2WG3 to the right of the Dell
monitor = DP-1, 2560x1440@165, 1080x0, 1
# Fallback for anything else plugged in later
monitor = , preferred, auto, 1

# ---- Wayland / portal env (needed for screen share, file pickers, etc.) ----
# 1. Push env into systemd/dbus so portals dbus-activated later see the right
#    XDG_CURRENT_DESKTOP and pick the hyprland backend.
# 2. Start hyprland-session.target -- via BindsTo it brings up
#    graphical-session.target, which xdg-desktop-portal.service requires
#    (Requisite=graphical-session.target). Without this the main portal
#    fails to start and screen sharing breaks.
# 3. Stop any portals that autostarted before env was set, then explicitly
#    start the hyprland portal.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start hyprland-session.target
exec-once = systemctl --user stop xdg-desktop-portal xdg-desktop-portal-hyprland xdg-desktop-portal-gnome xdg-desktop-portal-gtk
exec-once = sleep 1 && systemctl --user start xdg-desktop-portal-hyprland xdg-desktop-portal.service

# ---- Autostart ----
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar &
exec-once = hyprpaper &
# hyprpaper v0.8.4 ignores wallpaper/preload directives in its config file
# (see dotfiles/hypr/hyprpaper.conf). Drive it via IPC, and use the cycler
# script to set the last-used wallpaper (from ~/Pictures/wallpapers).
exec-once = sleep 1 && ~/.config/hypr/cycle-wallpaper.sh init
exec-once = hypridle &
exec-once = wl-paste --watch cliphist store &
exec-once = swaync &
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = ~/.config/hypr/workspace-watcher.sh &

# ---- Look & feel ----
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ffa7b9ee) rgba(ffa7b9ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000044)
    }
    active_opacity = 1.0
    inactive_opacity = 0.92
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 5, smooth, popin 80%
    animation = fade, 1, 6, smooth
    animation = workspaces, 1, 5, smooth, slide
    animation = border, 1, 8, smooth
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    # touchpad { natural_scroll = true }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---- Keybinds ----
$mod = SUPER
bind = $mod, RETURN, exec, kitty
bind = $mod, Q, killactive,
bind = $mod, E, exec, nautilus
bind = $mod, SPACE, exec, rofi -show drun
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, S, exec, hyprshot -m region
bind = $mod, ESCAPE, exec, wlogout
bind = $mod, G,      exec, steam
bind = $mod, backslash, exec, kitty --class=keybinds-cheatsheet -- less ~/.config/hypr/keybinds.txt
bind = $mod SHIFT, B, exec, killall waybar; sleep 0.2 && waybar &
bind = $mod SHIFT, R, exec, ~/.config/hypr/reload-watcher.sh
bind = $mod SHIFT, P, exec, waypaper   # GUI wallpaper picker

# Wallpaper cycling -- drop images into <repo>/wallpapers/
# SUPER+W enters a submap; press 1 (DP-1), 2 (DP-2), or Escape.
# IMPORTANT: while in a submap, ALL other SUPER binds are masked. To make
# sure you can never get stuck, the submap auto-exits after 3s of idle, on
# SUPER+W again, and on a bunch of common "oops" keys.
bind = $mod, W, exec, notify-send -t 1200 "Wallpaper" "1 = DP-1   2 = DP-2   Esc = cancel"
bind = $mod, W, submap, wallpaper
bind = $mod, W, exec, (sleep 3 && hyprctl dispatch submap reset) >/dev/null 2>&1 &

submap = wallpaper
bind = , 1,      exec, ~/.config/hypr/cycle-wallpaper.sh next DP-1
bind = , 1,      submap, reset
bind = , 2,      exec, ~/.config/hypr/cycle-wallpaper.sh next DP-2
bind = , 2,      submap, reset
bind = SHIFT, 1, exec, ~/.config/hypr/cycle-wallpaper.sh prev DP-1
bind = SHIFT, 1, submap, reset
bind = SHIFT, 2, exec, ~/.config/hypr/cycle-wallpaper.sh prev DP-2
bind = SHIFT, 2, submap, reset
# Escape hatches -- any of these exits the submap with no action.
bind = , escape, submap, reset
bind = , return, submap, reset
bind = , space,  submap, reset
bind = , q,      submap, reset
bind = $mod, W,  submap, reset
submap = reset

# Session exit (panic bind in case Hyprland is misbehaving)
bind = $mod SHIFT, M, exit,

# Screenshots
bind = , Print,          exec, hyprshot -m output
bind = $mod, Print,      exec, hyprshot -m active
bind = $mod SHIFT, Print, exec, hyprshot -m region

# Clipboard history (cliphist is already storing via autostart)
bind = $mod, C, exec, cliphist list | rofi -dmenu -p clip | cliphist decode | wl-copy

# Media / volume keys (pipewire via wpctl)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume         @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay,        exec, playerctl play-pause
bind = , XF86AudioNext,        exec, playerctl next
bind = , XF86AudioPrev,        exec, playerctl previous

# Mouse drag to move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Make the cheatsheet open as a centered floating window
windowrule {
    name = cheatsheet-float
    match:class = ^(keybinds-cheatsheet)$

    float  = true
    size   = 720 720
    center = true
}

# Workspace assignments are handled by ~/.config/hypr/workspace-watcher.sh
# (started from autostart further up). It watches Hyprland's event socket
# and dispatches movetoworkspacesilent when matching windows open.
# Rule table lives inside that script — edit there to add/change.

# Move focus / workspaces
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Swap the workspaces on the two monitors (Dell DP-2 ↔ AOC DP-1)
bind = $mod, O, swapactiveworkspaces, DP-1 DP-2
