# ---- Monitors (use `hyprctl monitors` to find names) ----
# Dell U2414H on the left, rotated 90° CW (portrait → 1080×1920 logical)
monitor = DP-2, 1920x1080@60, 0x0, 1, transform, 1
# AOC Q32G2WG3 to the right of the Dell
monitor = DP-1, 2560x1440@165, 1080x0, 1
# Fallback for anything else plugged in later
monitor = , preferred, auto, 1

# ---- Wayland / portal env (needed for screen share, file pickers, etc.) ----
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sleep 1 && systemctl --user restart xdg-desktop-portal.service

# ---- Autostart ----
exec-once = waybar &
exec-once = hyprpaper &
exec-once = hypridle &
exec-once = wl-paste --watch cliphist store &
exec-once = swaync &
exec-once = ~/.config/hypr/workspace-watcher.sh &

# ---- Look & feel ----
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000044)
    }
    active_opacity = 1.0
    inactive_opacity = 0.92
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 5, smooth, popin 80%
    animation = fade, 1, 6, smooth
    animation = workspaces, 1, 5, smooth, slide
    animation = border, 1, 8, smooth
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    # touchpad { natural_scroll = true }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---- Keybinds ----
$mod = SUPER
bind = $mod, RETURN, exec, kitty
bind = $mod, Q, killactive,
bind = $mod, E, exec, nautilus
bind = $mod, SPACE, exec, rofi -show drun
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, S, exec, hyprshot -m region
bind = $mod, ESCAPE, exec, wlogout
bind = $mod, G,      exec, steam
bind = $mod, backslash, exec, kitty --class=keybinds-cheatsheet -- less ~/.config/hypr/keybinds.txt

# Session exit (panic bind in case Hyprland is misbehaving)
bind = $mod SHIFT, M, exit,

# Screenshots
bind = , Print,          exec, hyprshot -m output
bind = $mod, Print,      exec, hyprshot -m active
bind = $mod SHIFT, Print, exec, hyprshot -m region

# Clipboard history (cliphist is already storing via autostart)
bind = $mod, C, exec, cliphist list | rofi -dmenu -p clip | cliphist decode | wl-copy

# Media / volume keys (pipewire via wpctl)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume         @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay,        exec, playerctl play-pause
bind = , XF86AudioNext,        exec, playerctl next
bind = , XF86AudioPrev,        exec, playerctl previous

# Mouse drag to move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Make the cheatsheet open as a centered floating window
windowrule {
    name = cheatsheet-float
    match:class = ^(keybinds-cheatsheet)$

    float  = true
    size   = 720 720
    center = true
}

# Workspace assignments are handled by ~/.config/hypr/workspace-watcher.sh
# (started from autostart further up). It watches Hyprland's event socket
# and dispatches movetoworkspacesilent when matching windows open.
# Rule table lives inside that script — edit there to add/change.

# Move focus / workspaces
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
