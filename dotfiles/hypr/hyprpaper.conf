# NOTE: hyprpaper v0.8.4 (Fedora 44) silently ignores `preload =` and
# `wallpaper =` lines in the config file. Wallpapers are set instead via
# `hyprctl hyprpaper wallpaper MON,PATH` from hyprland.conf autostart.
# Keep this file minimal -- only the always-on switches live here.
splash = false
ipc = on
